# Chart register: every chart the summary and report modules bring with them.
#
# Each chart names a recipe (how its table and chart are built) and the statement lines or
# groups it reads. The builder expands a recipe into formula rows on the module's sheet and
# a native chart over them, so the chart follows the model and the selections on its sheet.
#
# Frames (the months a chart shows):
#   year     the twelve months of the year shown; compare series are the year before and after
#   rolling  the twelve months to the month shown; compare series are the twelve months
#            before them and the twelve months after the month shown
#   at       the balance at the month shown
#   ytd      the year to the month shown
#   by_year  every financial year in the timeline
#
# Recipes:
#   compare   one line over three periods (prior, shown, next), as lines or columns, optionally cumulative
#   mix       a group stacked by month, with the group total for the periods before and after as lines
#   depth     a group's totals for the period, one column per member
#   pie       a group's make-up for the period
#   combo     chosen lines as columns (clustered or stacked) with chosen lines drawn over them
#   budget    actual (solid) and forecast (hatched) by month with the budget as a line
#   scenario  the line in each scenario, by month of the year shown or by year
#   bridge    a waterfall: net assets built up from the balance sheet, or opening to closing cash
#   movement  change in each balance sheet line (or the totals) against a year earlier
#
# Groups: rev, cogs, sal and opx are category sets (they grow and shrink with the model's
# categories); top N ranks members by the period's total and puts the rest in Other; lead adds
# a line in front of the group. The fixed groups (current_assets, equity, net_assets,
# working_capital, bs_parts, cash_parts, bs_lines, bs_totals) are defined in build.py.

modules:
