id: fm.scenario_report
title: Scenario report
code: ScnR
area: Scenario report
framework: report
description: >-
  Every scenario side by side: the income statement, cash and the balance sheet by financial year,
  then by month of the year shown. The figures come from the data table on the Scenarios sheet.
settings:
  - {key: year, label: Year shown, list: List_Years, default: 2, display: true}
rows:
  - {key: chk_tables, label: A chart's figures do not tie to the statements, unit: flag, check: error, span: 1, total: none, formula: "={report.errors}"}
