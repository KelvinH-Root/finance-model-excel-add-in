id: fm.other_equity
title: Other equity item
code: OEq
area: Other items
as_category: true
description: >-
  An other equity item (reserves): a balance with a planned change each month; the change is a financing cash flow. Actual months read the historical balance sheet.
rows:
  - {key: change, label: Planned change in the balance, unit: "$", input: forecast}
  - {key: balance, label: Closing balance, unit: "$", total: last, history: {in: bs, group: Other equity},
     formula: "=IF({actual},[hist:balance],[balance@prev]+[change])"}
  - {key: cash, label: Cash flow, unit: "$", formula: "=[balance]-[balance@prev]"}
outputs:
  - {link: bs.other_equity, row: balance}
  - {link: cf.other_financing, row: cash}
