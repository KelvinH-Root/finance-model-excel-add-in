id: fm.consolidation
title: Group consolidation
code: Cn
area: Group statements
framework: consolidation
description: >-
  Every entity's figures by group account and month in; every group's income statement, balance
  sheet and cash flow out, all as formulas. Entities hold the tree and the share each parent holds;
  the intercompany register and the intergroup balances are what Home Hub's matching hands over.
  Eliminations come from the register by type, the balance pairs, investments against capital and
  the margin still held by site; NCI is worked out at each node and carried into the groups above
  it. Group statements show the group chosen; By group holds every group's consolidation. Checks:
  each entity and each group nets to nil every month, the tree, both sides of every pair, each
  investment against the parent's share of capital, NCI and the cash flow.
settings:
  - {key: group, label: Group shown, list: List_Groups, default: 1, display: true}
rows:
  - {key: chk_tb, label: Entity trial balances that do not net to nil, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_TB>0,1,0)"}
  - {key: chk_tree, label: The entity tree is out of order or too deep, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Tree>0,1,0)"}
  - {key: chk_join, label: An entity has figures before it joins, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Join>0,1,0)"}
  - {key: chk_pairs, label: An intergroup transaction or balance does not match, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Pairs>0,1,0)"}
  - {key: chk_inv, label: "An investment is not the parent's share of capital", unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Inv>0,1,0)"}
  - {key: chk_elim, label: Eliminations do not net to nil, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Elim>0,1,0)"}
  - {key: chk_cons, label: A consolidated trial balance does not net to nil, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Cons>0,1,0)"}
  - {key: chk_nci, label: "NCI is not the outside investors' share", unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_NCI>0,1,0)"}
  - {key: chk_top, label: The top group still carries investments in group entities, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_Top>0,1,0)"}
  - {key: chk_cf, label: A group cash flow does not reconcile to cash, unit: flag, check: error, span: 1, total: none,
     formula: "=IF(Cn_Chk_CF>0,1,0)"}
  - {key: alert_planned, label: Planned entities Home Hub does not have yet, unit: flag, check: alert, span: 1, total: none,
     formula: "=IF(Cn_Alert_Planned>0,1,0)"}
  - {key: alert_netting, label: On-charges not raised by a month end (netting account balances), unit: flag, check: alert, span: 1,
     total: none, formula: "=IF(Cn_Alert_Netting>0,1,0)"}

# The group chart of accounts: the full financial model's statement lines for now (Kelvin, 26 October
# 2026); a group chart approved by the auditors replaces it later. Debit positive throughout.
# line: where it shows on the statements. cf: its place on the cash flow (cash, op, inv, fin; none for
# income statement accounts and opening retained earnings, which do not move). noncash: an expense
# the cash flow adds back, and the asset it belongs with. role: what the consolidation uses it for.
chart:
