id: fm.opex
title: Operating expense line
code: Opex
area: Revenue and expenses
as_category: true
description: >-
  An operating expense line: an amount, growth on the same month last year, or a share of total
  revenue, with a scenario adjustment, GST treatment and the payment profile it is paid through.
inputs:
  - {link: is.revenue, mode: total}
settings:
  - {key: method, label: Driver, choice: [Amount, Growth on the same month last year, Share of total revenue], default: 1}
  - {key: gst, label: GST treatment, list: List_GST_Treatment, default: 1}
  - {key: pay, label: Paid through, list: List_Payment, default: 1}
rows:
  - {section: Drivers}
  - {key: amount, label: Amount, unit: "$", input: forecast, when: "$method=1"}
  - {key: growth, label: Growth on the same month last year, unit: "%", input: forecast, when: "$method=2"}
  - {key: share, label: Share of total revenue, unit: "%", input: forecast, when: "$method=3"}
  - {collect: is.revenue, label: Total revenue, unit: "$", working: true}
  - {key: pre, label: Before the scenario adjustment, unit: "$", working: true,
     formula: "=CHOOSE($method,[amount],[cost@prev12]*(1+[growth]),[sum:is.revenue]*[share])"}
  - {section: Operating expense}
  - {key: cost, label: Operating expense, unit: "$", history: {in: is, group: Operating expenses}, scenario: true,
     formula: "=IF({actual},[hist:cost],[pre]*(1+{scenario}))"}
  - {key: gst_paid, label: GST on purchases, unit: "$", working: true, formula: "=[cost]*IF($gst=1,GST_Rate,0)"}
  - {key: billed, label: Billed including GST, unit: "$", formula: "=[cost]+[gst_paid]"}
  - {key: cash_paid, label: Paid when incurred, unit: "$", working: true, formula: "=IF($pay=1,[billed],0)"}
  - {key: chk_negative, label: Expense below zero in a forecast month, unit: flag, check: alert,
     formula: "=IF(AND({forecast},[cost]<0),1,0)"}
outputs:
  - {link: is.opex, row: cost}
  - {link: gst.input, row: gst_paid}
  - {link: wc.purchases, row: billed}
  - {link: cf.payments, row: cash_paid}
