id: fm.other_nca
title: Other non-current asset
code: ONCA
area: Other items
as_category: true
description: >-
  An other non-current asset (investments, bonds held): a balance with a planned change each month; the change is an investing cash flow. Actual months read the historical balance sheet.
rows:
  - {key: change, label: Planned change in the balance, unit: "$", input: forecast}
  - {key: balance, label: Closing balance, unit: "$", total: last, history: {in: bs, group: Other non-current assets},
     formula: "=IF({actual},[hist:balance],[balance@prev]+[change])"}
  - {key: cash, label: Cash flow, unit: "$", formula: "=[balance@prev]-[balance]"}
outputs:
  - {link: bs.other_nca, row: balance}
  - {link: cf.other_investing, row: cash}
