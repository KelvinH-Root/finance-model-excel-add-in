# Development test example: build recipe with fictional demo data.
#
# This example exists to prove the engine (template editing, row layout,
# category blocks, cross-sheet links, checks, verification). It is not a
# product and not HCP's model. All sites, names and figures are fictional.

model:
  name: Development Test Example
  entity_cell_note: Entity name comes from the template's Cover sheet.
  template_env: HFG_TEMPLATE        # path to Budget_Template.xlsx, never committed
  periods: 60                       # Time!H13 (Ts_Term), months from the template start (April 2025)
  last_actual_month: 11             # Time!H26 (DD_Ts_Last_Hist_Mth): actuals to February 2026
  insert_after: Seasonality         # new sheets go into the Financial Model section after this sheet
  checks_after: Checks
  theme:                            # HCP palette from the HFG brand guidelines (Kelvin, 2 October 2026)
    dk2: "0A132E"
    lt2: "E8E8E8"
    accent1: "575F46"               # olive: section bars, input fills
    accent2: "D9E6C5"
    accent3: "0A132E"
    accent4: "415166"
    accent5: "B5BBC4"
    accent6: "B4B7AC"

global:
  gst_rate: 0.15
  gst_lag_months: 1                 # GST for a month is settled with IRD this many months later
  fund_lvr: 0.75                    # Te Piringa (NZHF) purchase debt as a share of the BTR price

line_items:                         # standard cost lines for every site
  - {key: land, label: Land and acquisition}
  - {key: predev, label: Due diligence, design and consents}
  - {key: devcon, label: Development contributions and levies}
  - {key: civils, label: Civils and early works}
  - {key: vertical, label: Vertical construction}
  - {key: contingency, label: Contingency}
  - {key: fees, label: Professional fees during construction}
  - {key: gpfee, label: Development management (GP) fee}
  - {key: sales, label: Sales and marketing}

sites:
  - code: S01
    name: Demo Site A
    entity: Demo Site A LP
    include: Yes
    gst_registered: Yes
    units: 12
    opening: {wip: 3050000, debt: 1950000}
    scurve: {alpha: 2.0, beta: 2.0}
    lines:
      land:        {budget: 1200000, profile: Lump sum, start: 2025-01-01, months: 1,  gst: No}
      predev:      {budget: 350000,  profile: Flat,     start: 2025-01-01, months: 8,  gst: Yes}
      devcon:      {budget: 240000,  profile: Lump sum, start: 2025-09-01, months: 1,  gst: Yes}
      civils:      {budget: 600000,  profile: S-curve,  start: 2025-09-01, months: 6,  gst: Yes, counterparty: HCL}
      vertical:    {budget: 3600000, profile: S-curve,  start: 2025-11-01, months: 15, gst: Yes, counterparty: HCL}
      contingency: {budget: 210000,  profile: S-curve,  start: 2025-11-01, months: 15, gst: Yes}
      fees:        {budget: 150000,  profile: S-curve,  start: 2025-11-01, months: 15, gst: Yes}
      gpfee:       {budget: 180000,  profile: Flat,     start: 2025-04-01, months: 24, gst: Yes, counterparty: KM}
      sales:       {budget: 60000,   profile: Lump sum, start: 2027-03-01, months: 1,  gst: Yes}
    sale:
      date: 2027-03-01
      price: 9200000                # As Complete (BTS) value, GST inclusive where GST applies
      gst_treatment: Standard-rated
      via_spv: Yes
      btr_value: 11000000
    funding:
      method: LTC ceiling
      equity_commitment: 0
      limit_basis: LTC on budget
      limit_override: 0
      max_ltc: 0.70
      max_lvr: 0.70
      debt_start: 2025-09-01
      land_loan: 0
      rate: 0.065
      line_fee: 0.0
      estab_fee: 0.01
      capitalise: Yes
      release_equity: Yes
    accounting:
      capitalise_borrowing_costs: Yes

  - code: S02
    name: Demo Site B
    entity: Demo Site B LP
    include: Yes
    gst_registered: Yes
    units: 20
    opening: {wip: 0, debt: 0}
    scurve: {alpha: 2.0, beta: 2.5}
